<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signing in — Esmer</title>
<meta name="description" content="Completing your McCluster sign-in.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/site.css">
<style>.auth-return{min-height:100svh;display:grid;place-items:center;padding:2rem}.auth-return>div{width:min(100%,38rem)}.auth-return h1{font-size:clamp(2.5rem,8vw,5.5rem);line-height:.9;margin:.7rem 0 1rem}.auth-return a{border-bottom:1px solid currentColor}</style>
</head>
<body>
<main class="auth-return"><div><p class="eyebrow">McCluster account</p><h1 id="auth-head">Signing you in…</h1><p class="lede" id="auth-body">One moment.</p></div></main>
<script src="../js/mcc-auth.js"></script>
<script>
(function(){'use strict';var head=document.getElementById('auth-head');var body=document.getElementById('auth-body');var params=new URLSearchParams(location.search);var requested=params.get('next');var fallback=new URL('../book/',location.href).pathname;var next=(requested&&requested.charAt(0)==='/'&&requested.charAt(1)!=='/')?requested:fallback;MCC.complete().then(function(user){if(!user){head.textContent='Nothing to finish';body.innerHTML='<a href="'+fallback+'">Back to Esmer</a>';return}head.textContent='You are signed in';body.textContent='Taking you back…';location.replace(next)}).catch(function(error){head.textContent='That sign-in did not complete';body.textContent=error.message||'Please try again.'})})();
</script>
</body>
</html>
